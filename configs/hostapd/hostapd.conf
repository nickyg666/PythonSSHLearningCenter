# jailbreakBox AP Configuration - OPEN (No Password)
# Optimized for Unisoc WiFi driver
interface=wlan0
driver=nl80211
ssid=jailbreakBox
hw_mode=g
channel=1
ieee80211n=0
wmm_enabled=0
macaddr_acl=0
auth_algs=1
ignore_broadcast_ssid=0

# NO WPA/WPA2 - Open network
# Beacon settings for problematic drivers
beacon_int=100
dtim_period=2

# Device settings
max_num_sta=10

